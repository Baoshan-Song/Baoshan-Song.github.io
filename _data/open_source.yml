- name: "Certifiable Doppler Alignment"
  type: "Research code · MATLAB"
  description: "Align GNSS and local robot frames using Doppler measurements, Lagrangian duality, and semidefinite relaxation. Includes a simulation example and duality-gap evaluation for checking optimality."
  links:
    - label: "GitHub"
      url: "https://github.com/Baoshan-Song/Certifiable-Doppler-alignment"
    - label: "Paper"
      url: "https://doi.org/10.1109/LRA.2026.3693943"
    - label: "arXiv"
      url: "https://arxiv.org/abs/2512.20931"
- name: "Certifiable Doppler Positioning"
  type: "Research code · MATLAB / CVX"
  description: "LEO satellite Doppler positioning through semidefinite relaxation, with simulated observations and an Iridium satellite example. Companion code for the work on initialization-free, cold-start LEO positioning."
  links:
    - label: "GitHub"
      url: "https://github.com/Baoshan-Song/Certifiable-Doppler-positioning"
