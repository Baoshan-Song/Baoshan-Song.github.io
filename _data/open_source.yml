- name: "KFV–FGO Comparison"
  type: "Interactive toolbox · Python / Google Colab"
  description: "Compare Kalman filter variants and factor graph optimization using shared observations. Explore iteration, robust kernels, filter–graph equivalence, and sliding-window length in simulation and real GNSS/INS data."
